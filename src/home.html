<!DOCTYPE html>
<html lang="bg">
{{> head }}
<body>
	<div class="wrapper">
		{{> header active_home="true" }}

		<div class="hero" id="hero">
			<div class="hero__image">
				<img src="assets/images/temp/hero.jpeg" alt="Hero image">
			</div><!-- /.hero__image -->

			<div class="hero__inner">
				<div class="shell">
					<div class="hero__content animate-in">
						<div class="hero__entry">
							<h1 style="--t-delay: 0.4s" class="animate-in">Еуробулд ЕООД</h1>

							<p style="--t-delay: 0.6s" class="animate-in">Строителна компания.</p>
						</div><!-- /.hero__entry -->
					</div><!-- /.hero__content -->
				</div><!-- /.shell -->
			</div><!-- /.hero__inner -->
		</div><!-- /.hero -->

		<main class="main">
			<section class="section">
				<div class="shell">
					<div class="grid">
						<div class="grid__col grid__col--1of2">
							<div class="section__content animate-in">
								<h2 class="has-underline">За Еуробулд</h2>

								<p>....</p>

								<p>...</p>
							</div><!-- /.section__content -->
						</div><!-- /.grid__col grid__col-/-1of2 -->

						<div class="grid__col grid__col--1of2">
							<div class="section__image animate-in" style="--t-delay: 0.2s">
								<img src="assets/images/temp/section1.jpeg" alt="Section image" width="555" height="310">
							</div><!-- /.section__image -->
						</div><!-- /.grid__col grid__col-/-1of2 -->
					</div><!-- /.grid -->
				</div><!-- /.shell -->
			</section><!-- /.section -->



			<div class="callout">
				<div class="shell">
					<div class="callout__inner">
						<div class="callout__content">
							<h2 class="has-underline has-underline--white">Имате въпроси?</h2>

							<p>Свържете се с нас посредством формата ни за контакти или телефон.</p>
						</div><!-- /.callout__content -->

						<div class="callout__actions">
							<a href="contact.html" class="btn btn--white">Контакти</a>
						</div><!-- /.callout__actions -->
					</div><!-- /.callout__inner -->
				</div><!-- /.shell -->
			</div><!-- /.callout -->
		</main><!-- /.main -->

		{{> footer }}
	</div><!-- /.wrapper -->

	{{> scripts }}
</body>
</html>
